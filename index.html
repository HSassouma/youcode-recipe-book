<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
    <title>youcode_cuisinie</title>
  </head>
  <body class="bg-[#f7f7fa]">
    <header class="flex justify-between items-center mx-10">
      <div>
        <img src="logo.png" alt="logo" class="h-32 w-32" />
      </div>
      <div class="icon space-x-4">
        <button
          id="ajouter"
          class="bg-green-500 p-2 rounded-2xl text-[19px] text-white hover:bg-green-600 transition-colors"
        >
          + Ajouter une recette
        </button>
        <i class="fa-regular fa-circle-user text-[23px] hover:text-red-500"></i>
        <i class="fa-regular fa-bell text-[23px] hover:text-red-500"></i>
      </div>
    </header>

    <section
      class="hero relative mx-4 md:mx-10 mt-6 min-h-[350px] rounded-3xl overflow-hidden"
    >
      <div
        class="intro relative z-10 flex flex-col justify-center h-full min-h-[350px] px-5 md:px-10 space-y-3 text-white"
      >
        <h1 class="text-2xl md:text-4xl font-semibold">
          Discover Delicious Recipes
        </h1>

        <p class="text-sm md:text-base">
          Find inspiration for your next cooking adventure.
        </p>

        <div
          class="flex items-center gap-3 bg-white text-black rounded-2xl p-2 w-full max-w-md"
        >
          <i class="fas fa-search text-gray-500 ml-2"></i>

          <input
            type="text"
            placeholder="Rechercher une recette ..."
            class="w-full min-w-0 focus:outline-none text-sm md:text-base"
          />
        </div>
      </div>
    </section>

    <main class="mx-4 md:mx-10 mt-10">
      <div class="header flex items-center justify-between mb-6">
        <h1 class="text-2xl font-bold text-gray-800">Nos recettes</h1>
        <span id="nombre_recettes" class="text-gray-500 font-medium"
          >12 recettes</span
        >
      </div>

      <section
        id="contener_recette"
        class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"
      >
        <div
          class="bg-white rounded-2xl overflow-hidden shadow-sm hover:shadow-lg transition duration-300"
        >
          <img src="/pizza.jpg" alt="Pizza" class="w-full h-52 object-cover" />

          <div class="p-5 space-y-3">
            <h2 class="text-xl font-bold text-gray-800">Pizza</h2>

            <div
              class="flex items-center justify-between text-gray-500 text-sm"
            >
              <p>
                <i class="fa-solid fa-utensils mr-1"></i>
                Italia
              </p>

              <p>
                <i class="fa-regular fa-clock mr-1"></i>
                25 min
              </p>
            </div>

            <div class="flex items-center justify-between pt-2">
              <span
                class="bg-green-100 text-green-700 px-3 py-1 rounded-full text-xs font-semibold"
              >
                Easy
              </span>

              <button class="text-red-500 hover:text-red-700 transition">
                <i class="fa-regular fa-trash-can mr-1"></i>
                <span>Supprimer</span>
              </button>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
